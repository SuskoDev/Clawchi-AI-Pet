// ============================================================
// POSITION-BASED CLASSIFICATION (Problem 1 fix)
// All pixels (fill AND outline) in a region move together
// ============================================================

// Leg pixel lookup — exact coordinates including outline pixels
const LL = {};
[[9,25],[10,25],[11,25],[8,26],[9,26],[10,26],[11,26],[8,27],[9,27],[10,27],[9,28]].forEach(p => LL[p[0]+','+p[1]] = 'legUL');
[[11,28],[12,28],[13,28],[14,28],[11,29],[12,29],[13,29],[12,30]].forEach(p => LL[p[0]+','+p[1]] = 'legLL');
[[28,25],[29,25],[30,25],[28,26],[29,26],[30,26],[31,26],[29,27],[30,27],[31,27],[30,28]].forEach(p => LL[p[0]+','+p[1]] = 'legUR');
[[25,28],[26,28],[27,28],[28,28],[26,29],[27,29],[28,29],[27,30]].forEach(p => LL[p[0]+','+p[1]] = 'legLR');

function cls(x, y) {
  // Face features (exact positions)
  if ((y === 18 || y === 19) && (x === 15 || x === 16)) return 'leftEye';
  if ((y === 18 || y === 19) && (x === 23 || x === 24)) return 'rightEye';
  if (y === 20 && x >= 18 && x <= 21) return 'mouth';
  // Left claw: x<=10 for y<=20, plus outline at x=11 for y=14-19
  if ((x <= 10 && y <= 20) || (x === 11 && y >= 14 && y <= 19)) return 'leftClaw';
  // Right claw: x>=29 for y<=20, plus outline at x=28 for y=14-19
  if ((x >= 29 && y <= 20) || (x === 28 && y >= 14 && y <= 19)) return 'rightClaw';
  // Legs via lookup
  const lk = LL[x + ',' + y];
  if (lk) return lk;
  // Everything else is body
  return 'body';
}

// ============================================================
// FACE BACKING (Problem 2 fix)
// Body-color fills at all face feature positions are placed first.
// Actual face pixels overwrite them. If removed, red shows through.
// ============================================================

const FACE_POS = [
  [15,18],[16,18],[15,19],[16,19],   // left eye
  [23,18],[24,18],[23,19],[24,19],   // right eye
  [18,20],[19,20],[20,20],[21,20]    // mouth
];

// Claw-body boundary backing — red fills so outline doesn't orphan
const CLAW_BACKING = [
  [11,18],[11,19],  // left claw-body boundary
  [28,18],[28,19]   // right claw-body boundary
];

function genFrame(frame) {
  const dx0 = frame.all?.dx || 0;
  const dy0 = frame.all?.dy || 0;
  const removeSet = new Set((frame.remove || []).map(([x, y]) => `${x},${y}`));
  const map = new Map();

  // Step 1: Place body-color fills at face + claw boundary positions (lowest priority)
  for (const [fx, fy] of FACE_POS) {
    const nx = fx + dx0, ny = fy + dy0;
    map.set(`${nx},${ny}`, { x: nx, y: ny, c: R });
  }
  for (const [cx, cy] of CLAW_BACKING) {
    const nx = cx + dx0, ny = cy + dy0;
    map.set(`${nx},${ny}`, { x: nx, y: ny, c: R });
  }

  // Step 2: Process all base pixels (overwrites face backing where present)
  for (const [x, y, c] of BASE) {
    if (removeSet.has(`${x},${y}`)) continue;
    const part = cls(x, y);
    const t = frame.parts?.[part];
    const nx = x + dx0 + (t?.dx || 0);
    const ny = y + dy0 + (t?.dy || 0);
    map.set(`${nx},${ny}`, { x: nx, y: ny, c });
  }

  // Step 3: Extra pixels (shifted by global transform so they stay on the crab)
  if (frame.add) {
    for (const [x, y, c] of frame.add) {
      const nx = x + dx0, ny = y + dy0;
      map.set(`${nx},${ny}`, { x: nx, y: ny, c });
    }
  }

  return [...map.values()];
}

// ============================================================
// RENDERING
// ============================================================

const S = 8, OX = -16, OY = -48, CW = 320, CH = 240;
const BG = '#0f1525';

function drawFrame(ctx, pixels) {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, CW, CH);
  // Subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let gx = 0; gx < CW; gx += S) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, CH); ctx.stroke();
  }
  for (let gy = 0; gy < CH; gy += S) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(CW, gy); ctx.stroke();
  }
  for (const p of pixels) {
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x * S + OX, p.y * S + OY, S, S);
  }
}

// ============================================================
// PAGE SETUP — create cards, pre-generate frames, start loops
// ============================================================

const grid = document.getElementById('grid');

for (const anim of ANIMS) {
  const card = document.createElement('div');
  card.className = 'card';

  const h3 = document.createElement('h3');
  h3.textContent = anim.name;
  card.appendChild(h3);

  const canvas = document.createElement('canvas');
  canvas.width = CW;
  canvas.height = CH;
  card.appendChild(canvas);

  const info = document.createElement('div');
  info.className = 'info';
  info.textContent = `${anim.frames.length} frames @ ${anim.fps} FPS`;
  card.appendChild(info);

  grid.appendChild(card);

  // Pre-generate all frame pixel arrays at initialization
  const rendered = anim.frames.map(f => genFrame(f));
  const ctx = canvas.getContext('2d');
  let fi = 0;
  drawFrame(ctx, rendered[0]);

  setInterval(() => {
    fi = (fi + 1) % rendered.length;
    drawFrame(ctx, rendered[fi]);
  }, 1000 / anim.fps);
}

for (const anim of FACE_ANIMS) {
  const card = document.createElement('div');
  card.className = 'card';
  const h3 = document.createElement('h3');
  h3.textContent = anim.name;
  card.appendChild(h3);
  const canvas = document.createElement('canvas');
  canvas.width = CW; canvas.height = CH;
  card.appendChild(canvas);
  const info = document.createElement('div');
  info.className = 'info';
  info.textContent = `${anim.frames.length} frames @ ${anim.fps} FPS`;
  card.appendChild(info);
  faceGrid.appendChild(card);
  const rendered = anim.frames.map(f => genFrame(f));
  const ctx = canvas.getContext('2d');
  let fi = 0;
  drawFrame(ctx, rendered[0]);
  if (rendered.length > 1) {
    setInterval(() => { fi = (fi+1) % rendered.length; drawFrame(ctx, rendered[fi]); }, 1000 / anim.fps);
  }
}
