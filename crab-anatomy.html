// 10 body parts
const PARTS = {
  leftClaw:      { color: '#ffd93d', label: 'Left Claw' },
  rightClaw:     { color: '#ff8c00', label: 'Right Claw' },
  leftEye:       { color: '#ffffff', label: 'Left Eye' },
  rightEye:      { color: '#aaaaff', label: 'Right Eye' },
  mouth:         { color: '#e0e0e0', label: 'Mouth' },
  body:          { color: '#4d96ff', label: 'Body' },
  legUpperLeft:  { color: '#9b59b6', label: 'Upper Left Leg' },
  legLowerLeft:  { color: '#c39bd3', label: 'Lower Left Leg' },
  legUpperRight: { color: '#e91e9b', label: 'Upper Right Leg' },
  legLowerRight: { color: '#f48fb1', label: 'Lower Right Leg' },
  outline:       { color: '#555555', label: 'Outline' },
};

function classifyPixel(x, y, color) {
  // 1. Face features FIRST (black pixels that are NOT outline)
  if ((y === 18 || y === 19) && (x === 15 || x === 16)) return 'leftEye';
  if ((y === 18 || y === 19) && (x === 23 || x === 24)) return 'rightEye';
  if (y === 20 && x >= 18 && x <= 21) return 'mouth';

  // 2. All other black = outline
  if (color === '#000000') return 'outline';

  // 3. Claws (includes the top tips that stick up at y=11-12)
  if (y <= 20 && x <= 10) return 'leftClaw';
  if (y <= 20 && x >= 29) return 'rightClaw';

  // 4. Individual legs (separated from body by black gaps)
  if (y >= 25) {
    // Upper left leg
    if (y === 25 && x === 10) return 'legUpperLeft';
    if (y === 26 && (x === 9 || x === 10)) return 'legUpperLeft';
    if (y === 27 && x === 9) return 'legUpperLeft';
    // Lower left leg
    if (y === 28 && (x === 12 || x === 13)) return 'legLowerLeft';
    if (y === 29 && x === 12) return 'legLowerLeft';
    // Upper right leg
    if (y === 25 && x === 29) return 'legUpperRight';
    if (y === 26 && (x === 29 || x === 30)) return 'legUpperRight';
    if (y === 27 && x === 30) return 'legUpperRight';
    // Lower right leg
    if (y === 28 && (x === 26 || x === 27)) return 'legLowerRight';
    if (y === 29 && x === 27) return 'legLowerRight';
  }

  // 5. Everything else = body
  return 'body';
}

const SCALE = 16;
const OX = -3 * SCALE;
const OY = -10 * SCALE;

function draw(canvasId, mode) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, 640, 400);

  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  for (let i = 0; i <= 40; i++) {
    ctx.beginPath(); ctx.moveTo(i*SCALE, 0); ctx.lineTo(i*SCALE, 400); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*SCALE); ctx.lineTo(640, i*SCALE); ctx.stroke();
  }

  PIXELS.forEach(([x, y, color]) => {
    const part = classifyPixel(x, y, color);
    ctx.fillStyle = mode === 'anatomy' ? (PARTS[part]?.color || '#888') : color;
    ctx.fillRect(x * SCALE + OX, y * SCALE + OY, SCALE, SCALE);
  });
}

draw('anatomy', 'anatomy');
draw('original', 'original');

const legendEl = document.getElementById('legend');
Object.entries(PARTS).forEach(([key, info]) => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<div class="legend-swatch" style="background:${info.color}"></div><div><span class="legend-label">${info.label}</span></div>`;
  legendEl.appendChild(item);
});
